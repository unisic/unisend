[package]
name = "beeper-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "beeper_gpui"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "beeper-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree (matrix-sdk-ui): emoji names, groups, skin tones.
emojis = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Both already in the tree (GPUI, matrix-sdk); decoders come from GPUI's feature set.
image = { version = "0.25", default-features = false }
mime_guess = "2"
qrcode = { version = "0.14", default-features = false }
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs"] }
# The SDK's own conversation model: local echo and send queue, read receipts, reactions, edits,
# polls and membership changes as ready-made timeline items. Same release as matrix-sdk.
matrix-sdk-ui = { version = "=0.19.1", default-features = false, features = ["rustls-aws-lc-rs"] }
# Only for `secret_storage::DecodeError`, which matrix-sdk does not re-export. Already in the tree.
matrix-sdk-crypto = { version = "=0.19.1", default-features = false }
# The message search index (FTS5). Already in the tree through matrix-sdk-sqlite, same bundled SQLite.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# All already in the tree (cosmic-text): reading and mapping a user's own emoji font.
fontdb = { version = "0.23", default-features = false }
memmap2 = "0.9"
ttf-parser = { version = "0.25", default-features = false }
# Already in the tree (gpui-kit's Markdown view): the composer's CommonMark turned into Matrix HTML.
markdown = { version = "1", default-features = false }
# gpui-kit re-exports gpui (gpui-pre 0.3.6) and, on desktop, its platform layer.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "13c716b687b47f96a677aaf46c8fa341fa7208da", default-features = false, features = ["component", "assets"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
dirs = "6"

[target.'cfg(target_os = "android")'.dependencies]
gpui-mobile = { git = "https://github.com/itsbalamurali/gpui-mobile", rev = "5fd54f4554263ae06753e90472c7f2e2ff5d7495", default-features = false, features = ["clipboard", "file_selector", "vibration"] }
# Same version as gpui-mobile: calls into this app's own Java helper.
jni = "0.22"
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
webpki-root-certs = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
base64 = "0.22"
hmac = "0.12"
# Synapse's shared-secret registration signs with HMAC-SHA1.
sha1 = "0.10"
sha2 = "0.10"

# Truncation must cut on grapheme boundaries; see vendor/gpui-pre/PATCHES.md.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
