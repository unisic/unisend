[package]
name = "beeper-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "beeper_gpui"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "beeper-gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs"] }
# gpui-kit re-exports gpui (gpui-pre 0.3.6) and, on desktop, its platform layer.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "13c716b687b47f96a677aaf46c8fa341fa7208da", default-features = false, features = ["component"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
dirs = "6"

[target.'cfg(target_os = "android")'.dependencies]
gpui-mobile = { git = "https://github.com/itsbalamurali/gpui-mobile", rev = "5fd54f4554263ae06753e90472c7f2e2ff5d7495", default-features = false }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
webpki-root-certs = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
